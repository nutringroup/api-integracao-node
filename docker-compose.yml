# docker-compose.yml - VERSÃO FINALÍSSIMA COM A VERSÃO CORRETA

version: '3.8'

services:
  apigummy:
    container_name: apigummy
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./.docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
      - ./storage:/usr/share/nginx/storage
      - ./bootstrap/cache:/usr/share/nginx/bootstrap/cache
    depends_on:
      - postgres
      - redis
    networks:
      - networkis

  postgres:
    container_name: gummydb
    # ===== A CORREÇÃO FINAL ESTÁ AQUI =====
    image: 'postgres:15'
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: "nutringroup"
      POSTGRES_USER: "gummy"
      POSTGRES_PASSWORD: "Somosrosa@#2024"
    volumes:
      - gummy-db-data:/var/lib/postgresql/data
    networks:
      - networkis

  redis:
    container_name: redis
    image: redis:7
    command: ["redis-server", "--requirepass", "Somosrosa@#2024"]
    ports:
      - "6379:6379"
    networks:
      - networkis

volumes:
  gummy-db-data:

networks:
  networkis:
    driver: bridge
