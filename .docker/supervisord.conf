# .docker/supervisord.conf - VERSÃO ATUALIZADA

[supervisord]
nodaemon=true
user=root

[program:nginx]
command=/usr/sbin/nginx -g 'daemon off;'
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:php-fpm]
command=/usr/sbin/php-fpm8.2 --nodaemonize
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue-default]
command=php /usr/share/nginx/artisan queue:work --queue=default --sleep=3 --tries=3 --timeout=90
autostart=true
autorestart=true
user=www-data
priority=30
stdout_logfile=/var/log/supervisor/queue-default.log
stderr_logfile=/var/log/supervisor/queue-default.err.log

[program:queue-orders]
command=php /usr/share/nginx/artisan queue:work --queue=orders --sleep=3 --tries=3 --timeout=90
autostart=true
autorestart=true
user=www-data
priority=30
stdout_logfile=/var/log/supervisor/queue-orders.log
stderr_logfile=/var/log/supervisor/queue-orders.err.log

[program:queue-messages]
command=php /usr/share/nginx/artisan queue:work --queue=messages --sleep=3 --tries=3 --timeout=90
autostart=true
autorestart=true
user=www-data
priority=30
stdout_logfile=/var/log/supervisor/queue-messages.log
stderr_logfile=/var/log/supervisor/queue-messages.err.log
